[package]
name = "osxrdp"
version = "0.1.0"
edition = "2021"
description = "RDP server for macOS"

[[bin]]
name = "osxrdp"
path = "src/main.rs"

[dependencies]
# RDP protocol — handles negotiation, encoding, session loop
ironrdp-server = "0.10"
# DisplayControl virtual channel PDUs (MonitorLayoutEntry, resize)
ironrdp-displaycontrol = "0.5"
# Diff algorithm for dirty-region detection (find_different_rects_sub)
ironrdp-graphics = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS
rustls = "0.23"
rcgen = "0.13"
tokio-rustls = "0.26"

# Screen capture (macOS 12.3+)
screencapturekit = { version = "2", features = ["async"] }

# libc for signal handlers
libc = "0.2"

# Input injection — CGEventPost
core-graphics = { version = "0.25", features = ["highsierra"] }

# Frame data transfer
bytes = "1"

# Async trait support
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
# Domain-agnostic credential comparison (clients send arbitrary domain values)
ironrdp-acceptor = { path = "vendor/ironrdp-acceptor" }
# H.264 AVC420 encoding via RDPGFX pipeline
ironrdp-server = { path = "vendor/ironrdp-server" }
# GFX capability version handling - gracefully handle unknown client versions
ironrdp-pdu = { path = "vendor/ironrdp-pdu-0.7.0" }
