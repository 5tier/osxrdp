name: Build and Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: osxrdp
  BUNDLE_ID: com.github.osxrdp

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Gather binary info
        id: info
        run: |
          BINARY="target/release/${APP_NAME}"
          VERSION="${{ github.ref_name == 'main' && github.sha || github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "arch=$(file "$BINARY" | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z "$BINARY")" >> "$GITHUB_OUTPUT"

      - name: Create .app bundle
        run: |
          BUNDLE="${APP_NAME}.app"
          CONTENTS="${BUNDLE}/Contents"
          MACOS="${CONTENTS}/MacOS"
          RESOURCES="${CONTENTS}/Resources"

          mkdir -p "$MACOS" "$RESOURCES"

          cp "target/release/${APP_NAME}" "$MACOS/${APP_NAME}"

          # Generate Info.plist
          cat > "${CONTENTS}/Info.plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleDevelopmentRegion</key>
  <string>en</string>
  <key>CFBundleDisplayName</key>
  <string>${APP_NAME}</string>
  <key>CFBundleExecutable</key>
  <string>${APP_NAME}</string>
  <key>CFBundleIdentifier</key>
  <string>${BUNDLE_ID}</string>
  <key>CFBundleInfoDictionaryVersion</key>
  <string>6.0</string>
  <key>CFBundleName</key>
  <string>${APP_NAME}</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
  <key>CFBundleShortVersionString</key>
  <string>${{ steps.info.outputs.version }}</string>
  <key>CFBundleVersion</key>
  <string>${{ github.run_number }}</string>
  <key>LSMinimumSystemVersion</key>
  <string>12.0</string>
  <key>NSHighResolutionCapable</key>
  <true/>
  <key>NSHumanReadableCopyright</key>
  <string>MIT License</string>
</dict>
</plist>
PLIST

          # Ad-hoc sign the bundle (required for hardened runtime on modern macOS)
          codesign --force --deep --sign - "${BUNDLE}"

          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Package archive
        run: |
          ARCHIVE="${APP_NAME}-${{ steps.info.outputs.version }}-macos-arm64.tar.gz"
          tar czf "${ARCHIVE}" "${APP_NAME}.app"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "digest=$(shasum -a 256 "${ARCHIVE}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.info.outputs.version }}-macos-arm64
          path: ${{ env.APP_NAME }}-${{ steps.info.outputs.version }}-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ env.APP_NAME }}-${{ steps.info.outputs.version }}-macos-arm64.tar.gz
        run: |
          gh release create "${TAG}" \
            --title "${APP_NAME} ${TAG}" \
            --notes "See the [commit log](https://github.com/${{ github.repository }}/commits/${TAG}) for changes." \
            "${ARCHIVE}"
